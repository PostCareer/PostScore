<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郵局職二升職一成績計算器</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f4f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,77,37,0.12);
            max-width: 460px;
            width: 100%;
            border-top: 6px solid #007a3d;
        }
        h2 {
            text-align: center;
            color: #005a2b;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .section-title {
            font-weight: bold;
            color: #005a2b;
            border-bottom: 2px solid #007a3d;
            padding-bottom: 4px;
            margin-top: 18px;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 4px;
            color: #2d3748;
            font-size: 14px;
        }
        .sub-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .weight-tag {
            color: #007a3d;
            font-size: 12px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }
        input:focus {
            border-color: #007a3d;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 122, 61, 0.2);
        }
        .target-box {
            margin-top: 20px;
            padding: 16px;
            background-color: #fff3cd;
            border-radius: 10px;
            border: 1px solid #ffeeba;
            color: #856404;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            line-height: 1.6;
        }
        .target-score {
            color: #d9534f;
            font-size: 24px;
            font-weight: bold;
            display: inline-block;
            margin: 0 4px;
            text-decoration: underline;
        }
        .sub-text {
            font-size: 12px;
            color: #6c757d;
            font-weight: normal;
            display: block;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>郵局職二升職一成績計算器</h2>

    <div class="section-title">一、筆試得分（筆試總占 60%）</div>
    
    <div class="input-group">
        <label for="chiChoice">國文選擇題得分 <span class="weight-tag">滿分 40</span></label>
        <input type="number" id="chiChoice" placeholder="請輸入 0-40 分" min="0" max="40" oninput="calculateScore()">
    </div>

    <div class="input-group">
        <label for="civChoice">民法選擇題得分 <span class="weight-tag">滿分 50</span></label>
        <input type="number" id="civChoice" placeholder="請輸入 0-50 分" min="0" max="50" oninput="calculateScore()">
    </div>

    <div class="input-group">
        <label for="sub3">專業科目(一)得分 <span class="weight-tag">滿分 100</span></label>
        <input type="number" id="sub3" placeholder="請輸入 0-100 分" min="0" max="100" oninput="calculateScore()">
    </div>

    <div class="input-group">
        <label for="sub4">專業科目(二)得分 <span class="weight-tag">滿分 100</span></label>
        <input type="number" id="sub4" placeholder="請輸入 0-100 分" min="0" max="100" oninput="calculateScore()">
    </div>

    <div class="section-title">二、平時與加分項目</div>

    <div class="input-group">
        <label for="performance">烤雞得分 <span class="weight-tag">占 22%</span></label>
        <div class="sub-label">（前兩年平均）</div>
        <input type="number" id="performance" placeholder="請輸入 0-100 分" min="0" max="100" oninput="calculateScore()">
    </div>

    <div class="input-group">
        <label for="supervisor">主管加分 <span class="weight-tag">占 8%</span></label>
        <input type="number" id="supervisor" placeholder="請輸入 0-100 分" min="0" max="100" oninput="calculateScore()">
    </div>

    <div class="input-group">
        <label for="certificate">專業證照 <span class="weight-tag">直加最高 5 分</span></label>
        <input type="number" id="certificate" placeholder="請輸入 0-5 分" min="0" max="5" oninput="calculateScore()">
    </div>

    <div class="input-group">
        <label for="seniority">年資得分 <span class="weight-tag">直加最高 5 分</span></label>
        <input type="number" id="seniority" placeholder="請輸入 0-5 分" min="0" max="5" oninput="calculateScore()">
    </div>

    <div class="target-box">
        依照112年的目標分數70.15分，您的作文跟申論需要 <span class="target-score" id="neededEssay">--</span> 分才能錄取
        <span class="sub-text">（此為作文與申論折算百分制後之平均目標分）</span>
    </div>
</div>

<script>
    function calculateScore() {
        const chiChoice = parseFloat(document.getElementById('chiChoice').value) || 0;
        const civChoice = parseFloat(document.getElementById('civChoice').value) || 0;
        const sub3 = parseFloat(document.getElementById('sub3').value) || 0;
        const sub4 = parseFloat(document.getElementById('sub4').value) || 0;

        const performance = parseFloat(document.getElementById('performance').value) || 0;
        const supervisor = parseFloat(document.getElementById('supervisor').value) || 0;
        const certificate = parseFloat(document.getElementById('certificate').value) || 0;
        const seniority = parseFloat(document.getElementById('seniority').value) || 0;

        // 計算已知項目的總得分貢獻（換算至最終總算定分數）
        // 筆試 4 科，每科占總分數 60% / 4 = 15%
        const knownExamContribution = (chiChoice * 0.15) + (civChoice * 0.15) + (sub3 * 0.15) + (sub4 * 0.15);
        const otherContribution = (performance * 0.22) + (supervisor * 0.08) + certificate + seniority;
        
        const currentKnownTotal = knownExamContribution + otherContribution;

        // 112年錄取目標為 70.15
        const targetTotal = 70.15;
        const neededGap = targetTotal - currentKnownTotal;

        // 作文(60%) 與 申論(50%) 在筆試中的權重為 (60% + 50%) / 400 = 16.5%
        // 折算至總成績的權重為 16.5% * 0.6 = 0.165
        const neededEssayPercent = neededGap / 0.165;

        const neededElem = document.getElementById('neededEssay');

        if (neededGap <= 0) {
            neededElem.innerText = "0（已達標）";
        } else if (neededEssayPercent > 100) {
            neededElem.innerText = neededEssayPercent.toFixed(2) + "（超出滿分）";
        } else {
            neededElem.innerText = neededEssayPercent.toFixed(2);
        }
    }

    // 初始化計算
    calculateScore();
</script>

</body>
</html>
