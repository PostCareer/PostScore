<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郵局職二升職一成績計算器</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f4f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,77,37,0.12);
            max-width: 440px;
            width: 100%;
            border-top: 6px solid #007a3d;
        }
        h2 {
            text-align: center;
            color: #005a2b;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 14px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 4px;
            color: #2d3748;
            font-size: 15px;
        }
        .sub-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }
        .weight-tag {
            color: #007a3d;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s;
        }
        input:focus {
            border-color: #007a3d;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 122, 61, 0.2);
        }
        .result-box {
            margin-top: 20px;
            padding: 18px;
            background-color: #e6f4ea;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #b7e1cd;
        }
        .result-title {
            color: #137333;
            font-size: 15px;
            font-weight: 500;
        }
        .result-score {
            font-size: 38px;
            font-weight: bold;
            color: #005a2b;
            margin: 5px 0;
        }
        .target-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #fff3cd;
            border-radius: 8px;
            border: 1px solid #ffeeba;
            color: #856404;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }
        .target-score {
            color: #d9534f;
            font-size: 18px;
            text-decoration: underline;
        }
        .sub-text {
            font-size: 12px;
            color: #5f6368;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>郵局職二升職一成績計算器</h2>
    
    <div class="input-group">
        <label for="exam">筆試成績四科平均 <span class="weight-tag">占 60%</span></label>
        <div class="sub-label">（含國文作文60%及民法申論50%之總平均）</div>
        <input type="number" id="exam" placeholder="請輸入 0-100 分" min="0" max="100" oninput="calculateScore()">
    </div>

    <div class="input-group">
        <label for="performance">考績得分 <span class="weight-tag">占 22%</span></label>
        <input type="number" id="performance" placeholder="請輸入 0-100 分" min="0" max="100" oninput="calculateScore()">
    </div>

    <div class="input-group">
        <label for="supervisor">主管加分 <span class="weight-tag">占 8%</span></label>
        <input type="number" id="supervisor" placeholder="請輸入 0-100 分" min="0" max="100" oninput="calculateScore()">
    </div>

    <div class="input-group">
        <label for="certificate">專業證照 <span class="weight-tag">直加最高 5 分</span></label>
        <input type="number" id="certificate" placeholder="請輸入 0-5 分" min="0" max="5" oninput="calculateScore()">
    </div>

    <div class="input-group">
        <label for="seniority">年資得分 <span class="weight-tag">直加最高 5 分</span></label>
        <input type="number" id="seniority" placeholder="請輸入 0-5 分" min="0" max="5" oninput="calculateScore()">
    </div>

    <div class="result-box">
        <div class="result-title">總算定成績</div>
        <div class="result-score" id="totalScore">0.00</div>
        <div class="sub-text">（即時計算，四捨五入至小數點後兩位）</div>
    </div>

    <div class="target-box" id="targetBox">
        依照上次錄取分數 70.15 來計算：<br>
        您的筆試平均需要 <span class="target-score" id="neededExam">--</span> 分才能上榜
    </div>
</div>

<script>
    function calculateScore() {
        const exam = parseFloat(document.getElementById('exam').value) || 0;
        const performance = parseFloat(document.getElementById('performance').value) || 0;
        const supervisor = parseFloat(document.getElementById('supervisor').value) || 0;
        const certificate = parseFloat(document.getElementById('certificate').value) || 0;
        const seniority = parseFloat(document.getElementById('seniority').value) || 0;

        // 計算總分
        const total = (exam * 0.60) + 
                      (performance * 0.22) + 
                      (supervisor * 0.08) + 
                      certificate + 
                      seniority;

        document.getElementById('totalScore').innerText = total.toFixed(2);

        // 倒推上榜（70.15）所需的筆試四科平均分數
        const targetTotal = 70.15;
        const nonExamScore = (performance * 0.22) + (supervisor * 0.08) + certificate + seniority;
        const neededExamScore = (targetTotal - nonExamScore) / 0.60;

        const neededElem = document.getElementById('neededExam');
        if (neededExamScore <= 0) {
            neededElem.innerText = "0（目前分項已達標）";
        } else if (neededExamScore > 100) {
            neededElem.innerText = neededExamScore.toFixed(2) + "（需再提升其他加分項目）";
        } else {
            neededElem.innerText = neededExamScore.toFixed(2);
        }
    }

    // 初始化計算
    calculateScore();
</script>

</body>
</html>
